<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="瀬在丸 東慶のポートフォリオサイト。「想ったモノ」を形に。長く、高品質なアプリを創ります。"
    />
    <meta property="og:title" content="Sezaimaru Portfolio" />
    <meta property="og:type" content="website" />
    <meta
      property="og:description"
      content="「想ったモノ」を形に。長く、高品質なアプリを創ります。"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Sans+JP:wght@300..700&display=swap"
      rel="stylesheet"
    />
    <title>Sezaimaru Portfolio</title>
    <script>
      // React が起動する前にテーマを決めておき、ローディング画面やページが
      // 一瞬ライトで表示されてからダークに切り替わる「ちらつき」を防ぐ。
      // （判定ロジックは src/context/ThemeProvider.tsx と同じ）
      (function () {
        try {
          var theme = localStorage.getItem('portfolio-theme');
          if (theme !== 'light' && theme !== 'dark') {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.dataset.theme = theme;
        } catch (error) {
          /* localStorage が使えない環境では何もしない */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
